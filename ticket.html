<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Your personalized Coding Conf ticket.">
    <title>Your Ticket | Coding Conf</title>
    <link rel="stylesheet" href="style.css">
    <script src="ticket.js" defer></script>
    <style>
        body {
        background-image: url("background-desktop.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        }
    </style>
</head>
<body>

<img style="z-index: -100; display:flex; position: fixed;" src="pattern-lines.svg">
<header class="site-header">
    <a class="brand" href="index.html">
        <img class="brand-icon" src="logo-full.svg" alt="Coding Conf Logo">
    </a>
</header>

<main class="ticket-page">
    <section class="success-message" aria-live="polite">
        <p class="eyebrow">REGISTRATION COMPLETE</p>

        <h1>
            Congrats, <span class="gradient-text" id="congratulations-name">Attendee</span>!
            <br>Your ticket is ready.
        </h1>


    </section>
    <div class="ticket-top">
        <span style="text-align: center; margin-top: 40px;" class="ticket-badge">ADMISSION TICKET</span>
    </div>
    <section id="ticket-section" class="ticket-card" aria-label="Conference admission ticket">

        <div class="ticket-number">
            <span class="detail-label">TICKET</span>
            <p id="ticket-serial">#00000</p>
        </div>

        <div class="ticket-event">
            <span style="display: inline-flex"> <img style="margin: 6px;" class="" src="logo-mark.svg" alt="Coding Conf Ticket Logo">
                <h2>Coding Conf</h2>
            </span>
            <p>Oct 26, 2026 / Papine, Kgn</p>

        </div>

        <div class="attendee-details">
            <img
                    id="ticket-avatar"
                    class="ticket-avatar"
                    src=""
                    alt="Your uploaded profile avatar">

            <div class="attendee-info">
                <span class="detail-label">ATTENDEE</span>
                <h3 id="ticket-name">Your Name</h3>
                <span style="display: inline-flex;"> <img alt="GithubIcon" src="icon-github.svg"> <a id="ticket-github"
                       href="https://github.com/"
                       target="_blank"
                       rel="noopener noreferrer">
                        @username
                    </a>
                </span>
            </div>


        </div>

    </section>


    <div class="ticket-actions">
        <a class="button button-primary" href="index.html">
            Back to Home
        </a>
    </div>
</main>

<img id="pattern-change" src="pattern-lines.svg" class="bottom-left-image" alt=""></img>
<img src="pattern-squiggly-line-top.svg" class="top-right-image" alt="">

<footer class="site-footer">
    <a class="brand" href="index.html">
        <img src="logo-mark.svg" alt="Coding Conf Footer Logo">
        Coding Conf
    </a>
    <p>October 26, 2026 · Papine, Kgn</p>
</footer>
</body>
</html>
